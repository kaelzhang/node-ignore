name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        # `compat` checks each promised tag out into a worktree on Linux, so
        # only that runner needs the tags and the history that reaches them.
        fetch-depth: ${{ runner.os == 'Linux' && '0' || '1' }}
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install, build, and linting
      run: |
        npm install
        npm run build --if-present
        npm run lint
        npm run test:ts
      env:
        CI: true
    - name: test nodeResolution 16
      if: runner.os != 'Windows'
      run: |
        npm run test:16
    # The gate: every test case passes AND coverage of index.js is 100% on
    # statements, branches, functions and lines (test:cases runs tap with
    # --100, so anything less fails this step).
    - name: cases, with full coverage required
      run: |
        npm run test:cases
    # compat/config.js lists the released versions this working tree promises
    # to stay compatible with, plus the latest tag. Running both POSIX and
    # --win32 modes here on Linux reuses this job's checkout and node_modules
    # instead of spinning up a separate workflow and runner.
    - name: compatibility with promised releases
      if: runner.os == 'Linux'
      run: |
        npm run compat
    - name: upload to codecov
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
