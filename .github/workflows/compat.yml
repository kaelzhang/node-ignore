name: compat

# The compatibility gate. compat/declarations.js states, explicitly, which
# release the working tree stays behaviour-compatible with, and this
# workflow holds every commit to that promise: the tree is compared against
# `index.js` at the latest tag -- the build dependents actually run -- over
# ~3 million behavioural checks, plus the module surface and the type
# declarations.
#
# In steady state the promise names the latest release and nothing may
# differ. Changing behaviour on purpose starts by raising `compat` to the
# version that will ship the change and declaring each difference, in the
# same reviewed commit; undeclared differences fail regardless. Tagging
# that version settles the promise by itself -- no follow-up commit.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads index.js out of the latest tag, so it needs the
          # tags and the history that reaches them.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # No `npm install`: the gate depends on nothing but node and git.
      - name: the compatibility promise holds
        run: node compat

      - name: the promise holds under Windows path handling
        run: node compat --win32
