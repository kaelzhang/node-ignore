name: compat

# The compatibility gate. compat/config.js lists the released versions this
# working tree promises to stay compatible with, and this workflow holds
# every commit to that promise the only honest way: it runs each of those
# versions' own test suites -- the contract each one shipped -- against the
# current index.js. The tests are the contract, so if the old tests still
# pass, the current code still honours what those versions guaranteed.
#
# A failure means a guarantee was broken: a regression to fix, or a
# deliberate breaking change, which is recorded by dropping that version
# from compat/config.js in the same reviewed commit. The latest tag is
# always checked, so an accidental break of the release dependents run
# cannot slip through.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate checks each version out into a worktree, so it needs the
          # tags and the history that reaches them.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # The gate runs each version's test suite, so it needs the dev
      # dependencies (tap and the test helpers).
      - run: npm install

      - name: the compatibility promise holds
        run: node compat

      - name: the promise holds under Windows path handling
        run: node compat --win32
