name: benchmark comment

# Posts the comparison `benchmark.yml` made onto the pull request, and keeps
# one comment up to date rather than adding a new one per push.
#
# `workflow_run` runs this file as it is on master, with a token that can
# write, whoever opened the pull request. That is why nothing from the pull
# request is checked out or run here: its artifact is only read, as text.
on:
  workflow_run:
    workflows:
      - benchmark
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          number=$(cat number)

          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "not a pull request number: $number"
            exit 1
          fi

          # The number comes from the pull request's own run, so it is only
          # trusted when that pull request is still at the measured commit.
          head=$(gh api "repos/$REPO/pulls/$number" --jq .head.sha)

          if [ "$head" != "$HEAD_SHA" ]; then
            echo "#$number has moved on from $HEAD_SHA, skipping"
            exit 0
          fi

          marker='<!-- node-ignore-benchmark -->'
          zwsp=$(printf '\342\200\213')

          {
            echo "$marker"
            if [ "$CONCLUSION" = success ]; then
              echo "Benchmark passed for ${HEAD_SHA:0:7}. [Run]($RUN_URL)"
            else
              echo "**Benchmark failed** for ${HEAD_SHA:0:7}. [Run]($RUN_URL)"
            fi
            echo
            # Text the pull request produced: kept short, and with every
            # mention defused so it cannot notify anyone.
            head -c 60000 summary.md | sed "s/@/@$zwsp/g"
          } > body.md

          ours=".[] | select(.user.login == \"github-actions[bot]\")"
          ours="$ours | select(.body | startswith(\"$marker\")) | .id"
          existing=$(gh api --paginate "repos/$REPO/issues/$number/comments" \
            --jq "$ours" | tail -n 1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@body.md > /dev/null
          else
            gh api "repos/$REPO/issues/$number/comments" \
              -F body=@body.md > /dev/null
          fi
