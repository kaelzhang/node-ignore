name: benchmark

on:
  pull_request:
    branches:
      - master

# A newer push to the same pull request makes an in-flight run pointless, and
# two benchmark jobs sharing a runner would measure each other.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Linux only, on purpose. This compares two versions of the library
    # against each other on one machine; running that on three operating
    # systems would triple the cost to learn nothing extra.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be in the local history for the benchmark
          # to read `index.js` out of it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: benchmark against the base of this pull request
        id: benchmark
        # Explicit `shell: bash` is what turns pipefail on. The default shell
        # runs `bash -e` WITHOUT pipefail, and `tee` at the end of the pipe
        # would then swallow the non-zero exit of the regression check --
        # a gate that can never fail. Verified locally under both shells.
        shell: bash
        run: |
          node benchmark \
            --baseline ${{ github.event.pull_request.base.sha }} \
            --format markdown \
            --max-regression 25 \
            | tee benchmark.md

      - name: publish the comparison
        # Runs even when the step above failed on a regression, so the numbers
        # that caused the failure are the first thing a reader sees.
        if: always()
        run: |
          {
            echo '## Performance'
            echo
            echo 'Each version runs in a worker process of its own, with'
            echo 'samples interleaved between them, so the runner'"'"'s own drift'
            echo 'affects both alike. A delta smaller than the two subjects'"'"''
            echo 'combined sample spread is reported as `noise`, not a result.'
            echo
            cat benchmark.md
          } >> "$GITHUB_STEP_SUMMARY"
